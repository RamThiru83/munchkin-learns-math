<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Munchkin Learns Math</title>
<meta name="description" content="Gentle interactive maths games for little learners, from easy to tricky.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%89%3C/text%3E%3C/svg%3E">
<style>:root{
  --bg:#fff8e7; --ink:#2b2d42; --card:#ffffff; --line:#e8dfc8;
  --pink:#ff8fab; --yellow:#ffd166; --green:#06d6a0; --blue:#4cc9f0; --purple:#9b5de5; --orange:#ff9f1c; --red:#ef476f;
  --r:22px; --shadow:0 6px 0 rgba(43,45,66,.12);
  font-family: "Nunito","Baloo 2","Comic Neue","Trebuchet MS","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;font-size:18px;line-height:1.35;overscroll-behavior:none}
a{color:inherit}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

.btn{display:inline-flex;align-items:center;gap:.4em;justify-content:center;border:3px solid var(--ink);background:#fff;border-radius:999px;padding:.55em 1.1em;font-weight:800;text-decoration:none;cursor:pointer;box-shadow:0 4px 0 rgba(43,45,66,.18);min-height:48px;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.primary{background:var(--green)}
.btn.small{padding:.3em .8em;min-height:42px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:none;background:transparent;font-size:1.6rem;cursor:pointer;min-width:48px;min-height:48px}
.owl{display:block;flex:none}

/* ---------- home ---------- */
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:18px 20px;background:linear-gradient(120deg,#e7f9f2,#fff0f5);border-bottom:4px solid var(--ink)}
.hero h1{margin:0;font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:.5px}
.hero .tag{margin:.2em 0;font-weight:700}
.hero .count{margin:0;font-weight:800;color:#a05a00}
.hero-btns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.map{max-width:1100px;margin:0 auto;padding:14px 16px 40px}
.level{margin:24px 0;padding:16px;border-radius:28px;border:3px solid var(--ink);background:#fff}
.level h2{margin:0 0 12px;font-size:1.4rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.level h2 small{font-weight:600;opacity:.7;font-size:.9rem}
.lv1{background:#fff3df}.lv2{background:#e8f9ee}.lv3{background:#fff0f6}.lv4{background:#eaf4ff}.lv5{background:#f3ecff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;text-decoration:none;background:#fff;border:3px solid var(--ink);border-radius:var(--r);padding:26px 10px 12px;box-shadow:var(--shadow);transition:transform .12s;min-height:200px}
.tile:hover,.tile:focus-visible{transform:translateY(-4px) rotate(-1deg)}
.tile .big{font-size:3rem;line-height:1}
.tile strong{font-size:1.05rem}
.tile .sub{font-size:.82rem;opacity:.75}
.tile .stars{margin-top:auto;font-size:.95rem;font-weight:800;min-height:1.3em}
.tile .num{position:absolute;top:-12px;left:-8px;width:36px;height:36px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);display:grid;place-items:center;font-weight:900}
.tile.done{background:#f1fff9}
.tile.next{outline:4px dashed var(--orange);outline-offset:3px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.foot{text-align:center;padding:20px;font-size:.8rem;opacity:.7}

/* ---------- play frame ---------- */
.page-play{display:flex;flex-direction:column;height:100dvh;overflow:hidden;background:var(--bg)}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:3px solid var(--ink);background:#fff;flex-wrap:wrap}
.bar-title{font-weight:900;font-size:1.1rem;flex:1;min-width:140px}
.banner{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fffbe8;border-bottom:3px solid var(--ink);font-weight:800;font-size:clamp(1rem,2.6vw,1.35rem);min-height:62px}
.banner span{flex:1}
.banner.good{background:#d9fbe9}.banner.try{background:#ffe9ef}
.banner.pulse{animation:pulse .6s}
@keyframes pulse{40%{transform:scale(1.015)}}
.stage{position:relative;flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;align-items:center;touch-action:manipulation}
.stage.demo-running{pointer-events:none}
.dots{display:flex;gap:8px;justify-content:center;padding:6px;background:#fff;border-top:3px solid var(--ink)}
.dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.dot.full{background:var(--green)}.dot.now{background:var(--yellow)}
.err{font-weight:800;padding:2rem;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(43,45,66,.55);display:grid;place-items:center;z-index:50;padding:16px}
.overlay .card{background:#fff;border:4px solid var(--ink);border-radius:30px;padding:22px;text-align:center;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
.overlay .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.bigstars{font-size:2.4rem}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.confetti-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti-layer i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* shared building blocks for activities */
.dragging{filter:drop-shadow(0 8px 6px rgba(0,0,0,.25))}
.act-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.chip{display:inline-grid;place-items:center;min-width:56px;min-height:56px;border:3px solid var(--ink);border-radius:18px;background:#fff;font-size:2rem;box-shadow:0 3px 0 rgba(43,45,66,.15);cursor:pointer;user-select:none}
.chip.sel{background:var(--yellow)}
.choice{min-width:88px;min-height:88px;font-size:2.6rem}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hop{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-14px) scale(1.1)}}
.glow{box-shadow:0 0 0 5px rgba(255,209,102,.9)}

/* ---------- grown-ups ---------- */
.grown{max-width:760px;margin:0 auto;padding:20px 16px 60px}
.grown h2{margin-top:1.6em;border-bottom:3px solid var(--line)}
.note{background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px 14px;margin:10px 0}
.note h3{margin:.4em 0 0}.note p{margin:.3em 0 .6em}
.small{font-size:.8rem;opacity:.75}

@media (max-width:560px){ body{font-size:16px} .hero-btns{margin-left:0} .tiles{grid-template-columns:repeat(2,1fr)} .tile{min-height:180px} }
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<noscript>This website needs JavaScript to run the games.</noscript>

.a-same-or-more .field{--s:clamp(32px,9.5vw,54px);position:relative;width:100%;height:calc(var(--s)*3.85);background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.a-same-or-more .field.nt .it{transition:none}
.a-same-or-more .shelf{position:absolute;left:3%;right:3%;height:calc(var(--s)*.16);border-radius:99px;background:#efe6cf}
.a-same-or-more .shelf.t{top:calc(var(--s)*1.42)}
.a-same-or-more .shelf.b{top:calc(var(--s)*3.32)}
.a-same-or-more .it{position:absolute;width:var(--s);height:var(--s);display:grid;place-items:center;font-size:calc(var(--s)*.8);line-height:1;border-radius:50%;transition:left .9s cubic-bezier(.4,.1,.2,1),background .3s;pointer-events:none;animation:a-som-in .5s both}

.a-same-or-more .it.left{animation:a-som-pulse .9s ease-in-out infinite;background:rgba(255,159,28,.3);box-shadow:0 0 0 3px #ff9f1c}

.a-same-or-more .choices{width:100%;display:flex;gap:10px;justify-content:center;flex-wrap:nowrap}

.a-same-or-more .opt .ic{font-size:clamp(1.3rem,5.5vw,1.9rem);white-space:nowrap}
.a-same-or-more .opt small{font-size:.95rem;font-weight:800}
.a-same-or-more .opt.glow{background:var(--yellow)}
.a-same-or-more .actions{min-height:58px}
.a-same-or-more .actions .btn{min-height:56px;font-size:1.1rem}

.a-seats{--s:clamp(56px,12.5vw,88px);width:100%;max-width:720px;display:flex;flex-direction:column;align-items:center;gap:12px}
.a-seats [hidden]{display:none!important}
.a-seats .panel{width:100%;box-sizing:border-box;border:3px solid var(--ink);border-radius:22px;padding:10px;box-shadow:var(--shadow)}
.a-seats .room{background:linear-gradient(#fff3d6,#ffe6b0)}
.a-seats .tray{background:#eaf6ff}
.a-seats .waiting{background:#e7f9f2;min-height:calc(var(--s) + 22px)}
.a-seats .grid{display:grid;grid-template-columns:repeat(var(--cols,4),var(--s));justify-content:center;gap:8px;width:100%}
.a-seats .cwrap{position:relative;overflow:hidden;padding:6px;border-radius:14px}
.a-seats .slot{position:relative;display:block;width:100%;height:calc(var(--s)*1.12);padding:0;border:0;background:transparent;cursor:default}
.a-seats .slot.glow{box-shadow:none}
.a-seats .slot .chair{width:100%;height:100%;display:block;pointer-events:none}
.a-seats .slot::after{content:'';position:absolute;inset:-2px;border:4px solid transparent;border-radius:16px;pointer-events:none;z-index:3}
.a-seats .slot.left::after{border-color:#ff9f1c;animation:a-seats-ring 1s ease-in-out infinite}
.a-seats .slot.glow::after{border-color:#ffb703;box-shadow:0 0 0 4px rgba(255,209,102,.8)}
.a-seats .slot.tappable{cursor:pointer}
.a-seats .slot.new{animation:a-seats-in .5s cubic-bezier(.3,1.5,.5,1)}
.a-seats .slot.away{transform:scale(0);opacity:0;transition:transform .5s,opacity .5s}
.a-seats .home{position:relative;width:100%;aspect-ratio:1;animation:a-seats-in .4s backwards}
.a-seats .tok{position:relative;z-index:5;width:100%;height:100%;padding:0;border:0;background:none;display:grid;place-items:center;font-size:calc(var(--s)*.6);line-height:1;border-radius:50%;cursor:grab}
.a-seats .tok.star{font-size:calc(var(--s)*.55)}
.a-seats .tok .face{display:block;line-height:1;pointer-events:none}
.a-seats .tok.left{box-shadow:0 0 0 4px #ff9f1c;animation:a-seats-glow 1s ease-in-out infinite}
.a-seats .tok.happy .face{animation:a-seats-hop .6s ease var(--d,0ms) 2}
.a-seats .mark{position:absolute;left:50%;top:66%;transform:translate(-50%,-50%);font-size:calc(var(--s)*.45);line-height:1;z-index:4;pointer-events:none;transition:opacity .7s}
.a-seats .slot.unmark .mark{opacity:0}
.a-seats .cloth{position:absolute;inset:0;z-index:2;border-radius:14px;border:3px solid var(--ink);pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(239,71,111,.28) 0 14px,transparent 14px 28px),repeating-linear-gradient(90deg,rgba(239,71,111,.28) 0 14px,transparent 14px 28px),#fff0f4;
  transform:translateY(-118%);transition:transform .9s cubic-bezier(.3,1.2,.5,1)}
.a-seats .cloth.on{transform:none}
.a-seats .actions{min-height:58px}
.a-seats .actions .btn{min-height:56px;font-size:1.1rem}
.a-seats .choices{width:100%;display:flex;gap:10px;justify-content:center}
.a-seats .opt{flex:1 1 100px;max-width:200px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:92px;padding:8px 4px;line-height:1.1}
.a-seats .opt .ic{font-size:clamp(1.5rem,6vw,2.1rem);white-space:nowrap}
.a-seats .opt small{font-size:.95rem;font-weight:800;text-align:center}
.a-seats .opt.glow{background:var(--yellow)}
@keyframes a-seats-in{from{transform:scale(.4);opacity:0}}
@keyframes a-seats-hop{40%{transform:translateY(-14px) scale(1.12)}}
@keyframes a-seats-ring{50%{opacity:.35}}
@keyframes a-seats-glow{50%{box-shadow:0 0 0 9px rgba(255,159,28,.3)}}

.a-mirror-pegboard{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:100%;padding:6px 8px 10px;box-sizing:border-box}
.a-mirror-pegboard svg.mp-board{width:100%;max-width:540px;height:auto;max-height:62vh;touch-action:manipulation;display:block}
.a-mirror-pegboard .mp-hit{fill:transparent;cursor:pointer;outline:none}

.a-mirror-pegboard .mp-bright{animation:mpBright .8s ease-in-out 2}

.a-mirror-pegboard .mp-cap{font-weight:800;font-size:.95rem;margin-right:4px}

.a-snowflakes{position:relative;width:100%;max-width:760px;display:flex;flex-direction:column;align-items:center;gap:12px;padding-bottom:8px}
.a-snowflakes .board{width:min(440px,94%,52vh);aspect-ratio:1/1;border:3px solid #2b2d42;border-radius:26px;overflow:hidden;box-shadow:0 6px 0 rgba(43,45,66,.15);
  background:radial-gradient(circle,rgba(255,255,255,.32) 0 3px,transparent 4px) 0 0/26px 26px,linear-gradient(135deg,#4cc9f0,#7b6cf6 60%,#9b5de5)}
.a-snowflakes.r3 .board{width:min(360px,78%,40vh)}
.a-snowflakes svg.paper{display:block;width:100%;height:100%;filter:drop-shadow(0 4px 0 rgba(43,45,66,.3));cursor:crosshair;touch-action:manipulation}
.a-snowflakes .tools .chip{width:64px;height:64px;padding:0}
.a-snowflakes .tools .chip:disabled,.a-snowflakes .choice:disabled{opacity:.55;cursor:default}
.a-snowflakes .unfold{font-size:1.15rem;min-height:60px;padding:.4em 1.4em}
.a-snowflakes .undo{font-size:1.6rem}
.a-snowflakes .choices .choice{width:min(172px,29vw);height:auto;aspect-ratio:1/1;padding:5px;border-radius:22px;transition:transform .15s}
.a-snowflakes .choice .tb{width:100%;height:100%;border-radius:15px;background:linear-gradient(135deg,#4cc9f0,#7b6cf6 60%,#9b5de5)}
.a-snowflakes svg.thumb{display:block;width:100%;height:100%;filter:drop-shadow(0 2px 0 rgba(43,45,66,.3))}
.a-snowflakes .choice.right{background:#06d6a0;transform:scale(1.06)}
.a-snowflakes .hintmark{animation:snfPulse 1s ease-in-out infinite}
@keyframes snfPulse{50%{opacity:.2}}
.a-snowflakes .scissors{position:absolute;left:50%;top:40%;font-size:2.6rem;line-height:1;pointer-events:none;z-index:20;display:none;transform:translate(-20%,-30%);filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.a-snowflakes .scissors.on{display:block}

.a-pour-the-same{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:12px}
.a-pour-the-same .card{width:100%;background:#eaf7fb;border:3px solid var(--ink);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;display:flex;justify-content:center}

.a-pour-the-same .pic svg{display:block;width:100%;height:auto}
.a-pour-the-same .pic.good{background:#c9f5e4;border-color:#05a67a}

.a-dice-race{width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px;align-items:stretch;position:relative}
.a-dice-race .lanes{display:flex;flex-direction:column;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:8px}
.a-dice-race .lane{display:flex;align-items:center;gap:6px}
.a-dice-race .who{flex:0 0 108px;width:108px;min-width:0;box-sizing:border-box;min-height:62px;display:flex;align-items:center;justify-content:center;gap:3px;border:3px solid var(--ink);border-radius:16px;background:#fff;font:inherit;color:inherit;cursor:pointer;padding:2px 4px;position:relative;box-shadow:0 3px 0 rgba(43,45,66,.15)}
.a-dice-race .who .ani{font-size:1.9rem;line-height:1}
.a-dice-race .who .mini{width:22px;height:22px;flex:0 0 22px}
.a-dice-race .who .num{min-width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:1rem;background:#fff}
.a-dice-race .who.sel{background:var(--yellow)}
.a-dice-race .who .pk{position:absolute;top:-12px;right:-10px;font-size:1.2rem}
.a-dice-race .who .wins{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);font-size:.75rem;font-weight:900;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:0 5px;white-space:nowrap}
.a-dice-race .track{flex:1;display:flex;gap:3px;min-width:0}
.a-dice-race .cell{flex:1;min-width:0;height:58px;border-radius:12px;background:#f4eedd;display:grid;place-items:center;font-size:clamp(1.4rem,5vw,2rem);line-height:1}
.a-dice-race .runner{display:inline-block}
.a-dice-race .cell.fin{background:repeating-conic-gradient(#d9d2c0 0 25%,#fff 0 50%) 0 0/18px 18px;border:2px dashed var(--ink)}
.a-dice-race .lane.won .cell.fin{background:#d9fbe9}
.a-dice-race .tray{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;min-height:86px}
.a-dice-race .die{width:76px;height:76px}
.a-dice-race .die.roll{animation:dr-tumble .5s ease-out}
.a-dice-race .die.fast{animation-duration:.2s}
@keyframes dr-tumble{0%{transform:rotate(0) translateY(0)}35%{transform:rotate(140deg) translateY(-18px)}70%{transform:rotate(290deg) translateY(0)}100%{transform:rotate(360deg)}}
.a-dice-race .sum{font-size:clamp(1.3rem,5vw,1.9rem);font-weight:900;min-width:70px;text-align:center}
.a-dice-race .info{text-align:center;font-weight:800;min-height:1.5em;color:#5c5a52}
.a-dice-race .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.a-dice-race .btns .btn{min-height:58px;font-size:1.1rem}
.a-dice-race .ways{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;background:#fff;border:3px dashed var(--line);border-radius:16px;padding:8px 10px;font-weight:800}
.a-dice-race .ways>span{display:inline-flex;align-items:center;gap:4px}
.a-dice-race .ways .dotw{width:14px;height:14px;border-radius:50%;background:var(--green);border:2px solid var(--ink)}
.a-dice-race .ways .mini{width:22px;height:22px}
.a-dice-race .finger{position:absolute;left:0;top:0;font-size:2.4rem;pointer-events:none;z-index:50;opacity:0;transition:opacity .2s}
.a-dice-race .finger.on{opacity:1}
.a-dice-race .grid{display:grid;grid-template-columns:minmax(28px,.7fr) repeat(6,minmax(0,1fr));gap:4px;width:100%;max-width:max(300px,min(470px,calc(100dvh - 330px)));align-self:center}
.a-dice-race .hd{display:grid;place-items:center;font-weight:900;font-size:1.4rem}
.a-dice-race .hd svg{width:88%;max-width:46px;height:auto}
.a-dice-race .gc{aspect-ratio:1;min-height:46px;border:3px solid var(--ink);border-radius:12px;background:#fff;font:inherit;font-weight:900;font-size:clamp(1rem,4.6vw,1.6rem);color:var(--ink);cursor:pointer;padding:0;transition:background .2s}
.a-dice-race .gc.seen{background:#f1ecdf;color:#8a8577}
.a-dice-race .gc.seven{background:var(--green);color:#fff}
.a-dice-race .gc.one{outline:3px dashed var(--orange);outline-offset:-6px}
.a-dice-race .count{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

.a-which-room-larger{width:100%;max-width:960px;display:flex;flex-direction:column;align-items:center;gap:14px}
.a-which-room-larger .board{width:100%;display:flex;justify-content:center;align-items:stretch;gap:14px}
.a-which-room-larger .board.stack{flex-direction:column;align-items:center}
.a-which-room-larger .rm{background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:var(--shadow);padding:10px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:190px}
.a-which-room-larger .hd{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;font-size:1.05rem}
.a-which-room-larger .bd{display:inline-flex;align-items:center;gap:.3em;background:#fff8e7;border:3px solid var(--ink);border-radius:999px;padding:2px 12px;min-height:44px;font-weight:800;font-size:1.25rem;white-space:nowrap}
.a-which-room-larger .bd b{min-width:1.3em;text-align:center}
.a-which-room-larger .bd.full{background:#c9f5e6}
.a-which-room-larger .bd.bump{animation:a-wrl-pop .35s}
.a-which-room-larger svg{display:block;max-width:100%;height:auto;touch-action:manipulation}
.a-which-room-larger .cl{cursor:pointer}
.a-which-room-larger .fl{stroke:rgba(43,45,66,.28);stroke-width:2}
.a-which-room-larger .piece{transition:transform 1.3s cubic-bezier(.4,.1,.2,1)}
.a-which-room-larger .piece.hl .fl{fill:#ffc078}
.a-which-room-larger .walls{fill:none;stroke:#2b2d42;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;transition:opacity .3s;pointer-events:none}
.a-which-room-larger .mk{pointer-events:none;transform-box:fill-box;transform-origin:center;animation:a-wrl-pop .35s}
.a-which-room-larger .mk text{font-weight:800;fill:#fff;font-size:50px;text-anchor:middle}
.a-which-room-larger .foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.a-which-room-larger .foot .btn,.a-which-room-larger .actions .btn{min-height:56px;font-size:1rem}
.a-which-room-larger .actions{min-height:60px}

.a-robot-walks{width:100%;max-width:980px;display:flex;flex-direction:column;align-items:center;gap:10px}

.a-robot-walks .rw-boards.one .rw-board{max-width:640px}

.a-robot-walks .rw-empty{flex:1;text-align:center;font-weight:800;opacity:.55;pointer-events:none}
.a-robot-walks .rw-tag{font-weight:900;font-size:.85rem;width:100%;max-width:780px;margin:-2px 0 -4px;padding-left:8px;opacity:.8}

.a-construction-foreman{width:100%;max-width:1040px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start}
.a-construction-foreman.busy .cf-plan{pointer-events:none}
.a-construction-foreman .cf-scene{flex:1 1 360px;max-width:540px;min-width:0;border:3px solid ${Ce};border-radius:20px;overflow:hidden;background:linear-gradient(#dff3ff,#fff8e7 88%)}
.a-construction-foreman .cf-scene svg{display:block;width:100%;height:auto;max-height:40vh}
.a-construction-foreman .cf-plan{flex:1 1 320px;max-width:470px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.a-construction-foreman .cf-grid{display:grid;gap:4px;align-items:center;justify-content:center;width:100%}
.a-construction-foreman .cf-hd{text-align:center;font-weight:900;font-size:.95rem;border-radius:10px;padding:1px 0}
.a-construction-foreman .cf-hd.cf-corner{font-size:.65rem;opacity:.7}
.a-construction-foreman .cf-hd.now{background:var(--yellow)}
.a-construction-foreman .cf-who{display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:.8rem;line-height:1}
.a-construction-foreman .cf-who svg{width:30px;height:28px}
.a-construction-foreman .cf-cell{aspect-ratio:1/1;min-height:44px;border:3px dashed #c4b89c;border-radius:14px;background:#fffdf6;display:flex;padding:2px;transition:background .2s}
.a-construction-foreman .cf-cell.now{background:#fff1b8;border-style:solid;border-color:#f4b400}
.a-construction-foreman .cf-card{width:56px;height:56px;flex:none;border:3px solid ${Ce};border-radius:14px;font-size:1.6rem;font-weight:900;line-height:1;display:grid;place-items:center;position:relative;padding:0;color:${Ce};box-shadow:0 3px 0 rgba(43,45,66,.18)}
.a-construction-foreman .cf-cell .cf-card{width:100%;height:100%;font-size:1.35rem;border-radius:10px;box-shadow:none}
.a-construction-foreman .cf-card.glow,.a-construction-foreman .cf-cell.glow{box-shadow:0 0 0 5px rgba(255,190,40,.95)}

.a-necklaces{width:100%;max-width:920px;display:flex;flex-direction:column;align-items:center;gap:12px;padding-bottom:8px}
.a-necklaces .goal{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-weight:800;font-size:1.05rem;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:6px 14px;transition:box-shadow .2s}
.a-necklaces .need{display:inline-flex;gap:5px;align-items:center}
.a-necklaces .need i{width:24px;height:24px;border-radius:50%;border:3px dashed #118ab2;display:inline-block;box-sizing:border-box;transition:background .2s}
.a-necklaces .need i.on{border:3px solid var(--ink);background:${Tn}}
.a-necklaces .need i.over{border:3px solid var(--ink);background:${Tn};opacity:.55;transform:scale(.85)}
.a-necklaces .bench{position:relative;display:flex;align-items:center;gap:3px;padding:6px 20px;width:100%;box-sizing:border-box;background:#fdf0dc;border:3px solid var(--ink);border-radius:999px}
.a-necklaces .bench::before,.a-necklaces .mini::before{content:'';position:absolute;left:10px;right:10px;top:50%;height:5px;margin-top:-2.5px;background:#b07d4f;border-radius:3px}
.a-necklaces .clasp{position:absolute;left:3px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;border:3px solid #e0a800;box-sizing:border-box;background:#fdf0dc}
.a-necklaces .charm{position:absolute;right:3px;top:50%;transform:translateY(-52%);color:#ff5c8a;font-size:15px;line-height:1;font-weight:900}
.a-necklaces .bead{position:relative;flex:1 1 0;min-width:0;max-width:78px;aspect-ratio:1/1;border-radius:50%;border:3px solid var(--ink);padding:0;margin:0 auto;cursor:pointer;background:${Ua};box-shadow:0 3px 0 rgba(43,45,66,.18);transition:transform .12s;-webkit-tap-highlight-color:transparent}
.a-necklaces .bead.blue{background:${Tn}}
.a-necklaces .bead:active{transform:scale(.92)}
.a-necklaces .bead.tip{box-shadow:0 0 0 6px rgba(255,209,102,.95);animation:nk-pulse 1s ease-in-out infinite}
.a-necklaces .bead.tap{transform:scale(.88)}
@keyframes nk-pulse{50%{box-shadow:0 0 0 10px rgba(255,209,102,.55)}}
.a-necklaces .controls .btn{font-size:1.05rem}
.a-necklaces .hintcard{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;background:#fffbe8;border:3px dashed var(--orange);border-radius:18px;padding:8px 12px;font-weight:800;max-width:100%;box-sizing:border-box}
.a-necklaces .hintcard[hidden]{display:none}
.a-necklaces .shelf{width:100%;box-sizing:border-box;background:linear-gradient(#f6e3c4,#efd5ab);border:3px solid var(--ink);border-radius:20px;padding:8px 10px 12px}
.a-necklaces .shelf.done{background:linear-gradient(#e2f9ec,#c8f1da)}
.a-necklaces .shelf-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:900;margin:0 4px 8px}
.a-necklaces .shelf-head .count{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:1.05rem}
.a-necklaces .shelf-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:40px}
.a-necklaces .shelf-row .empty-note{opacity:.6;font-weight:700;align-self:center}
.a-necklaces .mini{position:relative;display:inline-flex;align-items:center;gap:3px;padding:5px 17px;background:#fff;border:3px solid var(--ink);border-radius:999px;box-sizing:border-box}
.a-necklaces .mini i{position:relative;width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);background:${Ua};box-sizing:border-box;transition:background .25s}
.a-necklaces .mini i.b{background:${Tn}}
.a-necklaces .mini .clasp{width:9px;height:9px;margin-top:-4.5px;border-width:2px;left:3px;background:#fff}
.a-necklaces .mini .charm{font-size:11px;right:3px}
.a-necklaces .mini.big{padding:7px 22px;gap:5px}
.a-necklaces .mini.big i{width:32px;height:32px;border-width:3px}
.a-necklaces .mini.empty{border-style:dashed;background:rgba(255,255,255,.45);color:rgba(43,45,66,.45);justify-content:center;font-weight:900}
.a-necklaces .mini.empty::before{display:none}

@keyframes nk-new{0%{transform:scale(.6)}60%{transform:scale(1.15)}}
.a-necklaces .nk-hand{position:fixed;left:0;top:0;font-size:42px;line-height:1;pointer-events:none;z-index:46;transition:transform .3s cubic-bezier(.4,.1,.2,1);filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}

.a-shoes-in-dark .scene.pulse{animation:sid-pulse 1.3s ease-in-out infinite}
@keyframes sid-pulse{50%{transform:scale(1.035)}}
.a-shoes-in-dark .hand{position:absolute;left:50%;top:0;width:60px;height:330px;pointer-events:none;transform:translate(-50%,-330px);transition:transform .46s cubic-bezier(.4,.1,.3,1);z-index:2}
.a-shoes-in-dark .hand .in{position:relative;width:60px;height:330px;transform-origin:30px 0}
.a-shoes-in-dark .hand svg{position:relative;z-index:2;display:block}
.a-shoes-in-dark .hand:not(.fist) .g-fist,.a-shoes-in-dark .hand.fist .g-open{display:none}
.a-shoes-in-dark .held{position:absolute;left:50%;top:216px;width:54px;height:66px;margin-left:-27px;z-index:1}
.a-shoes-in-dark .held .pic,.a-shoes-in-dark .item .pic{display:block;width:100%;height:100%}
.a-shoes-in-dark .held svg,.a-shoes-in-dark .item svg{width:100%;height:100%;display:block}
.a-shoes-in-dark .fr{z-index:3}
.a-shoes-in-dark .scene.rum .in{animation:sid-rum .2s ease-in-out 3}
.a-shoes-in-dark .scene.rum .fr{animation:sid-jig .2s ease-in-out 3}

.a-shoes-in-dark .slot{position:relative;flex:1 1 0;min-width:0;max-width:76px;aspect-ratio:4/5;border:3px dashed #d3c08f;border-radius:14px;background:rgba(255,255,255,.55)}
.a-shoes-in-dark .slot .no{position:absolute;left:4px;top:1px;font-size:.8rem;font-weight:900;color:#a8935f;z-index:1}
.a-shoes-in-dark .slot.full{border-style:solid;border-color:transparent;background:none}
.a-shoes-in-dark .item{position:absolute;inset:0;padding:3px;border-radius:14px;z-index:2}
.a-shoes-in-dark .item.pair{background:#fff3b8;box-shadow:0 0 0 4px rgba(255,209,102,.95)}
.a-shoes-in-dark .item.back .pic{transition:transform .5s,opacity .5s;transform:scale(.25);opacity:0}
.a-shoes-in-dark .ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:62px;width:100%}
.a-shoes-in-dark .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:340px}
.a-shoes-in-dark .chip.choice{min-width:58px;min-height:58px;font-size:1.9rem;font-weight:900;font-family:inherit;color:#2b2d42}

.a-wrong-labels{width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:10px;margin:auto 0}

.a-wrong-labels .col{flex:1 1 0;min-width:0;max-width:190px;display:flex;flex-direction:column;align-items:center;border-radius:18px;padding:2px}
.a-wrong-labels .peekzone{height:60px;display:flex;align-items:flex-start;padding-top:2px;justify-content:center;font-size:clamp(1.5rem,6vw,2.1rem);white-space:nowrap;line-height:1}

.a-wrong-labels .col.open .lid{transform:translateY(-2px) rotate(-9deg)}
