<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Munchkin Learns Math</title>
<meta name="description" content="Gentle interactive maths games for little learners, from easy to tricky.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%89%3C/text%3E%3C/svg%3E">
<style>:root{
  --bg:#fff8e7; --ink:#2b2d42; --card:#ffffff; --line:#e8dfc8;
  --pink:#ff8fab; --yellow:#ffd166; --green:#06d6a0; --blue:#4cc9f0; --purple:#9b5de5; --orange:#ff9f1c; --red:#ef476f;
  --r:22px; --shadow:0 6px 0 rgba(43,45,66,.12);
  font-family: "Nunito","Baloo 2","Comic Neue","Trebuchet MS","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;font-size:18px;line-height:1.35;overscroll-behavior:none}
a{color:inherit}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

.btn{display:inline-flex;align-items:center;gap:.4em;justify-content:center;border:3px solid var(--ink);background:#fff;border-radius:999px;padding:.55em 1.1em;font-weight:800;text-decoration:none;cursor:pointer;box-shadow:0 4px 0 rgba(43,45,66,.18);min-height:48px;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.primary{background:var(--green)}
.btn.small{padding:.3em .8em;min-height:42px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:none;background:transparent;font-size:1.6rem;cursor:pointer;min-width:48px;min-height:48px}
.owl{display:block;flex:none}

/* ---------- home ---------- */
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:18px 20px;background:linear-gradient(120deg,#e7f9f2,#fff0f5);border-bottom:4px solid var(--ink)}
.hero h1{margin:0;font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:.5px}
.hero .tag{margin:.2em 0;font-weight:700}
.hero .count{margin:0;font-weight:800;color:#a05a00}
.hero-btns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.map{max-width:1100px;margin:0 auto;padding:14px 16px 40px}
.level{margin:24px 0;padding:16px;border-radius:28px;border:3px solid var(--ink);background:#fff}
.level h2{margin:0 0 12px;font-size:1.4rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.level h2 small{font-weight:600;opacity:.7;font-size:.9rem}
.lv1{background:#fff3df}.lv2{background:#e8f9ee}.lv3{background:#fff0f6}.lv4{background:#eaf4ff}.lv5{background:#f3ecff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;text-decoration:none;background:#fff;border:3px solid var(--ink);border-radius:var(--r);padding:26px 10px 12px;box-shadow:var(--shadow);transition:transform .12s;min-height:200px}
.tile:hover,.tile:focus-visible{transform:translateY(-4px) rotate(-1deg)}
.tile .big{font-size:3rem;line-height:1}
.tile strong{font-size:1.05rem}
.tile .sub{font-size:.82rem;opacity:.75}
.tile .stars{margin-top:auto;font-size:.95rem;font-weight:800;min-height:1.3em}
.tile .num{position:absolute;top:-12px;left:-8px;width:36px;height:36px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);display:grid;place-items:center;font-weight:900}
.tile.done{background:#f1fff9}
.tile.next{outline:4px dashed var(--orange);outline-offset:3px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.foot{text-align:center;padding:20px;font-size:.8rem;opacity:.7}

/* ---------- play frame ---------- */
.page-play{display:flex;flex-direction:column;height:100dvh;overflow:hidden;background:var(--bg)}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:3px solid var(--ink);background:#fff;flex-wrap:wrap}
.bar-title{font-weight:900;font-size:1.1rem;flex:1;min-width:140px}
.banner{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fffbe8;border-bottom:3px solid var(--ink);font-weight:800;font-size:clamp(1rem,2.6vw,1.35rem);min-height:62px}
.banner span{flex:1}
.banner.good{background:#d9fbe9}.banner.try{background:#ffe9ef}
.banner.pulse{animation:pulse .6s}
@keyframes pulse{40%{transform:scale(1.015)}}
.stage{position:relative;flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;align-items:center;touch-action:manipulation}
.stage.demo-running{pointer-events:none}
.dots{display:flex;gap:8px;justify-content:center;padding:6px;background:#fff;border-top:3px solid var(--ink)}
.dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.dot.full{background:var(--green)}.dot.now{background:var(--yellow)}
.err{font-weight:800;padding:2rem;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(43,45,66,.55);display:grid;place-items:center;z-index:50;padding:16px}
.overlay .card{background:#fff;border:4px solid var(--ink);border-radius:30px;padding:22px;text-align:center;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
.overlay .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.bigstars{font-size:2.4rem}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.confetti-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti-layer i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* shared building blocks for activities */
.dragging{filter:drop-shadow(0 8px 6px rgba(0,0,0,.25))}
.act-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.chip{display:inline-grid;place-items:center;min-width:56px;min-height:56px;border:3px solid var(--ink);border-radius:18px;background:#fff;font-size:2rem;box-shadow:0 3px 0 rgba(43,45,66,.15);cursor:pointer;user-select:none}
.chip.sel{background:var(--yellow)}
.choice{min-width:88px;min-height:88px;font-size:2.6rem}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hop{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-14px) scale(1.1)}}
.glow{box-shadow:0 0 0 5px rgba(255,209,102,.9)}

/* ---------- grown-ups ---------- */
.agecard{border:3px solid var(--ink);border-radius:18px;padding:4px 16px 8px;margin:12px 0}
.agecard h3,.lvhead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin:.6em 0 .3em}
.ageband{font-size:.85rem;font-weight:800;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 10px}
.agecard ul{margin:.3em 0 .5em;padding-left:1.2em}.agecard li{margin:.3em 0}
.cite{font-size:.68em;line-height:0;white-space:nowrap}.cite a{text-decoration:none;color:#3a5bd9;font-weight:800}
.refs{font-size:.85rem;padding-left:1.6em}.refs li{margin:.35em 0;overflow-wrap:anywhere}.refs li:target{background:#fff3c4}
.note h4{margin:.4em 0 0;font-size:1.05rem}
.grown{max-width:760px;margin:0 auto;padding:20px 16px 60px}
.grown h2{margin-top:1.6em;border-bottom:3px solid var(--line)}
.note{background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px 14px;margin:10px 0}
.note h3{margin:.4em 0 0}.note p{margin:.3em 0 .6em}
.small{font-size:.8rem;opacity:.75}

@media (max-width:560px){ body{font-size:16px} .hero-btns{margin-left:0} .tiles{grid-template-columns:repeat(2,1fr)} .tile{min-height:180px} }
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>

.a-same-or-more .field{--s:clamp(32px,9.5vw,54px);position:relative;width:100%;height:calc(var(--s)*3.85);background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.a-same-or-more .field.nt .it{transition:none}
.a-same-or-more .shelf{position:absolute;left:3%;right:3%;height:calc(var(--s)*.16);border-radius:99px;background:#efe6cf}

.a-same-or-more .shelf.b{top:calc(var(--s)*3.32)}

.a-same-or-more .it.berry{top:calc(var(--s)*.4);z-index:2}

.a-same-or-more .it.basket.full{background:rgba(6,214,160,.28)}
.a-same-or-more .it.left{animation:a-som-pulse .9s ease-in-out infinite;background:rgba(255,159,28,.3);box-shadow:0 0 0 3px #ff9f1c}
@keyframes a-som-in{from{opacity:0}}
@keyframes a-som-pulse{50%{filter:drop-shadow(0 0 7px #ff9f1c)}}
.a-same-or-more .choices{width:100%;display:flex;gap:10px;justify-content:center;flex-wrap:nowrap}

.a-same-or-more .opt .ic{font-size:clamp(1.3rem,5.5vw,1.9rem);white-space:nowrap}
.a-same-or-more .opt small{font-size:.95rem;font-weight:800}
.a-same-or-more .opt.glow{background:var(--yellow)}
.a-same-or-more .actions{min-height:58px}
.a-same-or-more .actions .btn{min-height:56px;font-size:1.1rem}

.a-seats{--s:clamp(56px,12.5vw,88px);width:100%;max-width:720px;display:flex;flex-direction:column;align-items:center;gap:12px}
.a-seats [hidden]{display:none!important}
.a-seats .panel{width:100%;box-sizing:border-box;border:3px solid var(--ink);border-radius:22px;padding:10px;box-shadow:var(--shadow)}
.a-seats .room{background:linear-gradient(#fff3d6,#ffe6b0)}
.a-seats .tray{background:#eaf6ff}
.a-seats .waiting{background:#e7f9f2;min-height:calc(var(--s) + 22px)}
.a-seats .grid{display:grid;grid-template-columns:repeat(var(--cols,4),var(--s));justify-content:center;gap:8px;width:100%}
.a-seats .cwrap{position:relative;overflow:hidden;padding:6px;border-radius:14px}
.a-seats .slot{position:relative;display:block;width:100%;height:calc(var(--s)*1.12);padding:0;border:0;background:transparent;cursor:default}
.a-seats .slot.glow{box-shadow:none}
.a-seats .slot .chair{width:100%;height:100%;display:block;pointer-events:none}
.a-seats .slot::after{content:'';position:absolute;inset:-2px;border:4px solid transparent;border-radius:16px;pointer-events:none;z-index:3}
.a-seats .slot.left::after{border-color:#ff9f1c;animation:a-seats-ring 1s ease-in-out infinite}
.a-seats .slot.glow::after{border-color:#ffb703;box-shadow:0 0 0 4px rgba(255,209,102,.8)}
.a-seats .slot.tappable{cursor:pointer}
.a-seats .slot.new{animation:a-seats-in .5s cubic-bezier(.3,1.5,.5,1)}
.a-seats .slot.away{transform:scale(0);opacity:0;transition:transform .5s,opacity .5s}
.a-seats .home{position:relative;width:100%;aspect-ratio:1;animation:a-seats-in .4s backwards}
.a-seats .tok{position:relative;z-index:5;width:100%;height:100%;padding:0;border:0;background:none;display:grid;place-items:center;font-size:calc(var(--s)*.6);line-height:1;border-radius:50%;cursor:grab}
.a-seats .tok.star{font-size:calc(var(--s)*.55)}
.a-seats .tok .face{display:block;line-height:1;pointer-events:none}
.a-seats .tok.left{box-shadow:0 0 0 4px #ff9f1c;animation:a-seats-glow 1s ease-in-out infinite}
.a-seats .tok.happy .face{animation:a-seats-hop .6s ease var(--d,0ms) 2}
.a-seats .mark{position:absolute;left:50%;top:66%;transform:translate(-50%,-50%);font-size:calc(var(--s)*.45);line-height:1;z-index:4;pointer-events:none;transition:opacity .7s}
.a-seats .slot.unmark .mark{opacity:0}
.a-seats .cloth{position:absolute;inset:0;z-index:2;border-radius:14px;border:3px solid var(--ink);pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(239,71,111,.28) 0 14px,transparent 14px 28px),repeating-linear-gradient(90deg,rgba(239,71,111,.28) 0 14px,transparent 14px 28px),#fff0f4;
  transform:translateY(-118%);transition:transform .9s cubic-bezier(.3,1.2,.5,1)}
.a-seats .cloth.on{transform:none}
.a-seats .actions{min-height:58px}
.a-seats .actions .btn{min-height:56px;font-size:1.1rem}
.a-seats .choices{width:100%;display:flex;gap:10px;justify-content:center}
.a-seats .opt{flex:1 1 100px;max-width:200px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:92px;padding:8px 4px;line-height:1.1}
.a-seats .opt .ic{font-size:clamp(1.5rem,6vw,2.1rem);white-space:nowrap}
.a-seats .opt small{font-size:.95rem;font-weight:800;text-align:center}
.a-seats .opt.glow{background:var(--yellow)}
@keyframes a-seats-in{from{transform:scale(.4);opacity:0}}
@keyframes a-seats-hop{40%{transform:translateY(-14px) scale(1.12)}}
@keyframes a-seats-ring{50%{opacity:.35}}
@keyframes a-seats-glow{50%{box-shadow:0 0 0 9px rgba(255,159,28,.3)}}

.a-odd-one-out .board{display:grid;gap:12px;width:100%;justify-content:center;padding-top:20px}
.a-odd-one-out .board.n3{grid-template-columns:repeat(3,minmax(0,160px))}
.a-odd-one-out .board.n4{grid-template-columns:repeat(4,minmax(0,140px))}
.a-odd-one-out .board.n5{grid-template-columns:repeat(5,minmax(0,116px))}

.a-odd-one-out .card{position:relative;aspect-ratio:1;min-width:0;border:3px solid var(--ink);border-radius:22px;background:#fff;box-shadow:var(--shadow);padding:6px;cursor:pointer;font:inherit;transition:transform .25s cubic-bezier(.3,1.4,.5,1),background .25s,border-color .25s}

.a-odd-one-out .reasons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.a-odd-one-out .reason{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;width:100px;min-height:96px;padding:4px;font:inherit}
.a-odd-one-out .reason svg{width:56px;height:56px;display:block;pointer-events:none}
.a-odd-one-out .reason small{font-size:1rem;font-weight:800;line-height:1.1}
.a-odd-one-out .stars{display:flex;gap:8px;font-size:1.8rem;min-height:2.2rem}
.a-odd-one-out .stars span{filter:grayscale(1);opacity:.45;transition:all .3s}
.a-odd-one-out .stars span.on{filter:none;opacity:1;transform:scale(1.15)}

.a-mirror-pegboard{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:100%;padding:6px 8px 10px;box-sizing:border-box}
.a-mirror-pegboard svg.mp-board{width:100%;max-width:540px;height:auto;max-height:62vh;touch-action:manipulation;display:block}
.a-mirror-pegboard .mp-hit{fill:transparent;cursor:pointer;outline:none}
@media (hover:hover){.a-mirror-pegboard .mp-hit:hover{fill:rgba(255,255,255,.4)}}
.a-mirror-pegboard .mp-hit:focus-visible{stroke:#2b2d42;stroke-width:4}
.a-mirror-pegboard .mp-peg,.a-mirror-pegboard .mp-ghost,.a-mirror-pegboard .mp-ring{transform-box:fill-box;transform-origin:center}
.a-mirror-pegboard .mp-pop{animation:mpPop .45s cubic-bezier(.3,1.6,.5,1)}
.a-mirror-pegboard .mp-oops{animation:mpOops .7s ease-in forwards}
.a-mirror-pegboard .mp-ghost{animation:mpGhost 1.3s ease-in-out infinite}
.a-mirror-pegboard .mp-ring{animation:mpRing .9s ease-in-out infinite}
.a-mirror-pegboard .mp-fade{animation:mpFade 2.2s ease-out forwards}
.a-mirror-pegboard .mp-strip{animation:mpShine 3s ease-in-out infinite}
.a-mirror-pegboard .mp-bright{animation:mpBright .8s ease-in-out 2}
.a-mirror-pegboard .mp-tray{display:flex;gap:8px;align-items:center;justify-content:center;min-height:30px;flex-wrap:wrap}
.a-mirror-pegboard .mp-dot{width:26px;height:26px;border-radius:50%;border:3px solid #2b2d42;background:#fff;transition:background .2s,transform .2s}
.a-mirror-pegboard .mp-dot.on{transform:scale(1.15)}
.a-mirror-pegboard .mp-cap{font-weight:800;font-size:.95rem;margin-right:4px}
.a-mirror-pegboard .mp-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.a-mirror-pegboard .mp-actions .btn{min-height:56px}

.a-snowflakes{position:relative;width:100%;max-width:760px;display:flex;flex-direction:column;align-items:center;gap:12px;padding-bottom:8px}
.a-snowflakes .board{width:min(440px,94%,52vh);aspect-ratio:1/1;border:3px solid #2b2d42;border-radius:26px;overflow:hidden;box-shadow:0 6px 0 rgba(43,45,66,.15);
  background:radial-gradient(circle,rgba(255,255,255,.32) 0 3px,transparent 4px) 0 0/26px 26px,linear-gradient(135deg,#4cc9f0,#7b6cf6 60%,#9b5de5)}
.a-snowflakes.small .board{width:min(360px,78%,40vh)}
.a-snowflakes .goal{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid #2b2d42;border-radius:20px;padding:6px 14px 6px 6px;box-shadow:0 4px 0 rgba(43,45,66,.15);max-width:100%}
.a-snowflakes .goal:empty{display:none}
.a-snowflakes .goal .tb{width:min(120px,28vw);aspect-ratio:1/1;border-radius:14px;background:linear-gradient(135deg,#4cc9f0,#7b6cf6 60%,#9b5de5)}
.a-snowflakes .goal b{font-size:1.25rem}
.a-snowflakes svg.paper{display:block;width:100%;height:100%;filter:drop-shadow(0 4px 0 rgba(43,45,66,.3));cursor:crosshair;touch-action:manipulation}
.a-snowflakes .tools .chip{width:64px;height:64px;padding:0}
.a-snowflakes .tools .chip:disabled,.a-snowflakes .choice:disabled{opacity:.55;cursor:default}
.a-snowflakes .unfold{font-size:1.15rem;min-height:60px;padding:.4em 1.4em}
.a-snowflakes .undo{font-size:1.6rem}
.a-snowflakes .choices .choice{width:min(172px,27vw);height:auto;aspect-ratio:1/1;padding:5px;border-radius:22px;transition:transform .15s}
.a-snowflakes .choice .tb{width:100%;height:100%;border-radius:15px;background:linear-gradient(135deg,#4cc9f0,#7b6cf6 60%,#9b5de5)}
.a-snowflakes svg.thumb{display:block;width:100%;height:100%;filter:drop-shadow(0 2px 0 rgba(43,45,66,.3))}
.a-snowflakes .choice.right{background:#06d6a0;transform:scale(1.06)}
.a-snowflakes .hintmark{animation:snfPulse 1s ease-in-out infinite}
@keyframes snfPulse{50%{opacity:.2}}
.a-snowflakes .scissors{position:absolute;left:50%;top:40%;font-size:2.6rem;line-height:1;pointer-events:none;z-index:20;display:none;transform:translate(-20%,-30%);filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.a-snowflakes .scissors.on{display:block}
.snf-ghost{position:fixed;z-index:2000;pointer-events:none;transform:translate(-50%,-50%) scale(1.4);opacity:.85;display:none}

.a-missing-shape{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:18px}
.a-missing-shape .board{--cs:clamp(62px,19vw,98px);display:grid;grid-template-columns:repeat(var(--n),var(--cs));gap:clamp(6px,2vw,10px);padding:clamp(8px,2.5vw,14px);background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:var(--shadow);max-width:100%}
.a-missing-shape .board.n2{--cs:clamp(80px,27vw,124px)}
.a-missing-shape .board.n4{--cs:clamp(60px,19vw,88px)}
.a-missing-shape .cell{width:var(--cs);height:var(--cs);border-radius:16px;background:#fdf3d6;display:grid;place-items:center;position:relative;transition:background .25s,box-shadow .25s}
.a-missing-shape .cell svg{width:84%;height:84%;display:block}
.a-missing-shape .cell.hole{background:#fff;border:3px dashed var(--ink);animation:a-ms-pulse 1.6s ease-in-out infinite}
.a-missing-shape .cell.hole.done{border:0;animation:none;background:#fdf3d6}
.a-missing-shape .cell .q{font-size:calc(var(--cs)*.5);font-weight:900;opacity:.4;line-height:1}
.a-missing-shape .cell.hl{background:#ffe9a8;box-shadow:0 0 0 4px var(--orange)}
.a-missing-shape .tray{display:flex;gap:clamp(8px,2.5vw,16px);flex-wrap:wrap;justify-content:center;padding:clamp(8px,2.5vw,14px);background:#fff;border:3px solid var(--ink);border-radius:24px;max-width:100%;min-height:calc(56px + 24px)}
.a-missing-shape .opt.choice{position:relative;width:clamp(64px,17.5vw,92px);height:clamp(64px,17.5vw,92px);min-width:56px;min-height:56px;padding:0;touch-action:none;display:grid;place-items:center}
.a-missing-shape .opt svg{width:80%;height:80%;pointer-events:none;display:block}
.a-missing-shape .opt.glow{background:var(--yellow)}
.a-missing-shape .opt:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
.a-missing-shape .tray.off .opt{pointer-events:none}

.a-rope-rings{width:100%;max-width:760px;display:flex;flex-direction:column;align-items:center;gap:10px;padding-bottom:6px}
.a-rope-rings .rr-board{position:relative;width:100%;box-sizing:border-box;border:3px solid var(--ink);border-radius:22px;overflow:hidden;background:radial-gradient(circle at 30% 20%,#fffaf0 0,#fff0d6 60%,#f7e2bd)}
.a-rope-rings .rr-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.a-rope-rings .rr-lens.hint{animation:rr-lens .9s ease-in-out infinite}
@keyframes rr-lens{50%{fill:rgba(255,209,102,.95)}}
.a-rope-rings .rr-label{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;background:#fff;border:3px solid;border-radius:999px;padding:2px 12px 2px 6px;font-weight:900;font-size:1rem;white-space:nowrap;z-index:4;pointer-events:none}
.a-rope-rings .rr-label svg{width:24px;height:24px}
.a-rope-rings .rr-label .dot{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink);box-sizing:border-box}
.a-rope-rings .rr-label.out{border-style:dashed;border-color:#a89b82;color:#7a6f5b;font-size:.82rem;padding:1px 10px}
.a-rope-rings .rr-tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;min-height:76px;width:100%;box-sizing:border-box;padding:8px;background:#fff;border:3px dashed #b9a98a;border-radius:20px}
.a-rope-rings .rr-tray.gone{display:none}
.a-rope-rings .rr-tray.locked{pointer-events:none;opacity:.6}
.a-rope-rings .rr-tok{position:relative;width:60px;height:60px;padding:0;border:0;background:transparent;cursor:grab;z-index:5;-webkit-tap-highlight-color:transparent}
.a-rope-rings .rr-tok svg{width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(43,45,66,.25))}
.a-rope-rings .rr-tok.placed{position:absolute;height:auto;aspect-ratio:1/1;z-index:3;cursor:default}
.a-rope-rings .rr-tok.pickable{cursor:pointer}
.a-rope-rings .rr-tok.ok svg{filter:drop-shadow(0 0 6px #06d6a0) drop-shadow(0 0 3px #06d6a0)}
.a-rope-rings .rr-tok.ok::after{content:'\\2713';position:absolute;right:-2px;top:-4px;width:20px;height:20px;line-height:20px;text-align:center;font-weight:900;font-size:.8rem;border-radius:50%;background:#06d6a0;color:#fff;border:2px solid var(--ink)}
.a-rope-rings .rr-tok.tip svg{filter:drop-shadow(0 0 7px #ff9f1c) drop-shadow(0 0 4px #ff9f1c);animation:rr-hop .7s ease-in-out infinite}
.a-rope-rings .rr-tok.wob svg{animation:rr-wob .4s}
.a-rope-rings .rr-tok.hopx svg{animation:rr-hop .5s}
.a-rope-rings .rr-tok.dragging{z-index:1000}
@keyframes rr-wob{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes rr-hop{40%{transform:translateY(-10px) scale(1.12)}}
.a-rope-rings .rr-slot{position:absolute;transform:translate(-50%,-50%);aspect-ratio:1/1;pointer-events:none;opacity:0}
.a-rope-rings .rr-hint{position:absolute;transform:translate(-50%,-50%);aspect-ratio:1/1;border:4px dashed #ff9f1c;border-radius:50%;box-sizing:border-box;pointer-events:none;z-index:2;animation:rr-pulse 1s ease-in-out infinite}
@keyframes rr-pulse{50%{transform:translate(-50%,-50%) scale(1.15);background:rgba(255,209,102,.4)}}

.a-pour-the-same .acts{min-height:60px}
.a-pour-the-same .acts .btn{min-height:56px;font-size:1.1rem}
.a-pour-the-same .choices,.a-pour-the-same .pics{width:100%;display:flex;gap:10px;justify-content:center}
.a-pour-the-same .opt{flex:1 1 0;max-width:176px;min-width:0;min-height:84px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
.a-pour-the-same .opt .ic{font-size:clamp(1.5rem,6vw,2.1rem);white-space:nowrap}
.a-pour-the-same .opt small{font-size:.95rem;font-weight:800}
.a-pour-the-same .opt.glow,.a-pour-the-same .pic.glow{background:var(--yellow)}
.a-pour-the-same .pic{flex:1 1 0;max-width:180px;min-width:0;padding:4px;border:3px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 3px 0 rgba(43,45,66,.15);cursor:pointer;display:block}
.a-pour-the-same .pic svg{display:block;width:100%;height:auto}
.a-pour-the-same .pics.tallpics .pic svg{height:clamp(84px,15vh,128px);width:auto;margin:0 auto}
.a-pour-the-same .card.short svg{max-height:36vh}
.a-pour-the-same .pic.good{background:#c9f5e4;border-color:#05a67a}
@media (max-width:420px){.a-pour-the-same .opt small{font-size:.82rem}}

.a-dice-race{width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px;align-items:stretch;position:relative}
.a-dice-race .lanes{display:flex;flex-direction:column;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:8px}
.a-dice-race .lane{display:flex;align-items:center;gap:6px}
.a-dice-race .who{flex:0 0 108px;width:108px;min-width:0;box-sizing:border-box;min-height:62px;display:flex;align-items:center;justify-content:center;gap:3px;border:3px solid var(--ink);border-radius:16px;background:#fff;font:inherit;color:inherit;cursor:pointer;padding:2px 4px;position:relative;box-shadow:0 3px 0 rgba(43,45,66,.15)}
.a-dice-race .who .ani{font-size:1.9rem;line-height:1}
.a-dice-race .who .mini{width:22px;height:22px;flex:0 0 22px}
.a-dice-race .who .num{min-width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:1rem;background:#fff}
.a-dice-race .who.sel{background:var(--yellow)}
.a-dice-race .who .pk{position:absolute;top:-12px;right:-10px;font-size:1.2rem}
.a-dice-race .who .wins{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);font-size:.75rem;font-weight:900;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:0 5px;white-space:nowrap}
.a-dice-race .track{flex:1;display:flex;gap:3px;min-width:0}
.a-dice-race .cell{flex:1;min-width:0;height:58px;border-radius:12px;background:#f4eedd;display:grid;place-items:center;font-size:clamp(1.4rem,5vw,2rem);line-height:1}
.a-dice-race .runner{display:inline-block}
.a-dice-race .cell.fin{background:repeating-conic-gradient(#d9d2c0 0 25%,#fff 0 50%) 0 0/18px 18px;border:2px dashed var(--ink)}
.a-dice-race .lane.won .cell.fin{background:#d9fbe9}
.a-dice-race .tray{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;min-height:86px}
.a-dice-race .die{width:76px;height:76px}

.a-dice-race .die.fast{animation-duration:.2s}

.a-dice-race .sum{font-size:clamp(1.3rem,5vw,1.9rem);font-weight:900;min-width:70px;text-align:center}
.a-dice-race .info{text-align:center;font-weight:800;min-height:1.5em;color:#5c5a52}
.a-dice-race .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.a-dice-race .btns .btn{min-height:58px;font-size:1.1rem}
.a-dice-race .ways{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;background:#fff;border:3px dashed var(--line);border-radius:16px;padding:8px 10px;font-weight:800}
.a-dice-race .ways>span{display:inline-flex;align-items:center;gap:4px}
.a-dice-race .ways .dotw{width:14px;height:14px;border-radius:50%;background:var(--green);border:2px solid var(--ink)}
.a-dice-race .ways .mini{width:22px;height:22px}
.a-dice-race .finger{position:absolute;left:0;top:0;font-size:2.4rem;pointer-events:none;z-index:50;opacity:0;transition:opacity .2s}
.a-dice-race .finger.on{opacity:1}
.a-dice-race .grid{display:grid;grid-template-columns:minmax(18px,.3fr) repeat(6,minmax(0,1fr));gap:2px 3px;width:100%;max-width:max(344px,min(470px,calc(100dvh - 330px)));align-self:center}
.a-dice-race .hd{display:grid;place-items:center;font-weight:900;font-size:1.4rem}
.a-dice-race .hd svg{width:92%;max-width:46px;height:auto}
.a-dice-race .gc{aspect-ratio:1;min-height:48px;border:3px solid var(--ink);border-radius:12px;background:#fff;font:inherit;font-weight:900;font-size:clamp(1rem,4.6vw,1.6rem);color:var(--ink);cursor:pointer;padding:0;transition:background .2s}
.a-dice-race .gc.seen{background:#f1ecdf;color:#8a8577}
.a-dice-race .gc.seven{background:var(--green);color:#fff}
.a-dice-race .gc.one{outline:3px dashed var(--orange);outline-offset:-6px}
.a-dice-race .count{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.a-dice-race .count .chip{font-weight:900}
.a-dice-race .goal{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:clamp(1.4rem,6vw,2rem)}
.a-dice-race .goal .big{min-width:60px;height:60px;border-radius:50%;border:4px solid var(--ink);background:var(--yellow);display:grid;place-items:center}
.a-dice-race .slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.a-dice-race .slot{display:flex;align-items:center;gap:2px;min-width:72px;height:46px;justify-content:center;border:3px dashed var(--line);border-radius:14px;background:#fff;font-weight:900;color:#a39e90}
.a-dice-race .slot.full{border-style:solid;border-color:var(--green);background:#e8fbf3}
.a-dice-race .slot svg{width:30px;height:30px}
.a-dice-race .pickers{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;align-items:center}
.a-dice-race .pk3{display:grid;grid-template-columns:repeat(3,62px);gap:6px;padding:8px;border-radius:18px;border:3px solid var(--ink)}
.a-dice-race .pk3.w{background:#fff}.a-dice-race .pk3.p{background:#ffe3ea}
.a-dice-race .face{width:62px;height:62px;padding:3px;border:3px solid transparent;border-radius:16px;background:transparent;cursor:pointer}
.a-dice-race .face svg{width:100%;height:100%;display:block}
.a-dice-race .face.sel{border-color:var(--ink);background:var(--yellow)}
.a-dice-race .plus{font-size:2rem;font-weight:900}
.a-dice-race .nums{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:420px;align-self:center}
.a-dice-race .nb{width:62px;min-height:74px;border:3px solid var(--ink);border-radius:16px;background:#fff;font:inherit;font-weight:900;font-size:1.5rem;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px 2px;box-shadow:0 3px 0 rgba(43,45,66,.15)}
.a-dice-race .nb.sel{background:var(--yellow)}
.a-dice-race .nb .dts{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:46px}

.a-dice-race .vs{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:center;align-items:center;font-weight:900;font-size:1.15rem}
.a-dice-race .tally{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:3px solid var(--ink);border-radius:16px;background:#fff;min-height:48px}
.a-dice-race .tally .ani{font-size:1.7rem}
.a-dice-race .tally .dd{display:inline-flex;flex-wrap:wrap;gap:2px;max-width:66px}

.a-which-room-larger{width:100%;max-width:960px;display:flex;flex-direction:column;align-items:center;gap:14px}
.a-which-room-larger .board{width:100%;display:flex;justify-content:center;align-items:stretch;gap:14px}
.a-which-room-larger .board.stack{flex-direction:column;align-items:center}
.a-which-room-larger .rm{background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:var(--shadow);padding:10px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:190px}
.a-which-room-larger .hd{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;font-size:1.05rem}
.a-which-room-larger .bd{display:inline-flex;align-items:center;gap:.3em;background:#fff8e7;border:3px solid var(--ink);border-radius:999px;padding:2px 12px;min-height:44px;font-weight:800;font-size:1.25rem;white-space:nowrap}
.a-which-room-larger .bd b{min-width:1.3em;text-align:center}
.a-which-room-larger .bd.full{background:#c9f5e6}
.a-which-room-larger .bd.bump{animation:a-wrl-pop .35s}
.a-which-room-larger svg{display:block;max-width:100%;height:auto;touch-action:manipulation}
.a-which-room-larger .cl{cursor:pointer}
.a-which-room-larger .fl{stroke:rgba(43,45,66,.28);stroke-width:2}
.a-which-room-larger .piece{transition:transform 1.3s cubic-bezier(.4,.1,.2,1)}
.a-which-room-larger .piece.hl .fl{fill:#ffc078}
.a-which-room-larger .walls{fill:none;stroke:#2b2d42;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;transition:opacity .3s;pointer-events:none}
.a-which-room-larger .mk{pointer-events:none;transform-box:fill-box;transform-origin:center;animation:a-wrl-pop .35s}
.a-which-room-larger .mk text{font-weight:800;fill:#fff;font-size:50px;text-anchor:middle}
.a-which-room-larger .foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.a-which-room-larger .foot .btn,.a-which-room-larger .actions .btn{min-height:56px;font-size:1rem}
.a-which-room-larger .actions{min-height:60px}

.a-block-chains{--s:clamp(56px,15vw,84px);width:100%;max-width:980px;display:flex;flex-direction:column;align-items:center;gap:14px;padding-bottom:12px}
.a-block-chains .board{width:100%;display:flex;justify-content:center}
.a-block-chains .chain{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 3px;max-width:100%;padding-bottom:30px}
.a-block-chains .slot{width:var(--s);height:var(--s);border:3px dashed #c9c3b2;border-radius:18px;background:rgba(255,255,255,.55);display:grid;place-items:center;position:relative;flex:none;transition:background .2s,border-color .2s}
.a-block-chains .slot.open{border-color:#2b2d42;background:#fffbe9}
.a-block-chains .slot.filled{border-color:transparent;background:transparent}
.a-block-chains .blk{width:calc(var(--s) - 4px);height:calc(var(--s) - 4px);border-radius:16px;background:#fff;border:2px solid #e6dfcb;box-shadow:0 3px 0 rgba(43,45,66,.14);position:relative;display:grid;place-items:center;flex:none}
.a-block-chains .blk svg{width:92%;height:92%;pointer-events:none}
.a-block-chains .blk.dragging{box-shadow:0 10px 18px rgba(43,45,66,.25)}
.a-block-chains .conn{display:flex;flex-direction:column;gap:2px;padding:3px;border-radius:12px;background:#fff;border:2px solid #e6dfcb;flex:none}
.a-block-chains .ic{width:16px;height:16px;padding:1px;border-radius:50%;opacity:.28;transition:opacity .2s,background .2s;display:block}
.a-block-chains .ic.on{opacity:1;background:#ffe08a;box-shadow:0 0 0 2px #ffd166}
.a-block-chains .ic.peek{opacity:1;background:#ffe08a;animation:bc-pulse .9s ease-in-out infinite}
@keyframes bc-pulse{50%{box-shadow:0 0 0 5px rgba(255,209,102,.9);transform:scale(1.25)}}
.a-block-chains .grid{display:grid;gap:3px;align-items:center;justify-items:center;max-width:100%;padding-bottom:30px}
.a-block-chains .ring{position:relative;width:min(100%,440px);aspect-ratio:1/1;flex:none}
.a-block-chains .ring.n4{width:min(100%,300px)}
.a-block-chains .ring .slot{position:absolute}
.a-block-chains .ring .conn{position:absolute;transform:translate(-50%,-50%)}
.a-block-chains .ring .conn{flex-direction:row}
.a-block-chains .ring .mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.a-block-chains .ring.spin{animation:bc-spin 1.4s cubic-bezier(.5,0,.3,1)}
@keyframes bc-spin{to{rotate:360deg}}
.a-block-chains .bub{position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%);display:flex;gap:3px;align-items:center;background:#fff;border:2px solid #f4a261;border-radius:12px;padding:2px 5px;z-index:30;pointer-events:none;animation:bc-in .25s ease-out}
.a-block-chains .bub .ic,.a-block-chains .tip .ic{opacity:1;width:20px;height:20px;background:#ffe9c7}
.a-block-chains .bub b{font-size:.8rem}
.a-block-chains .tip{position:absolute;top:-14px;right:-10px;display:flex;background:#fff;border:2px solid #ffd166;border-radius:12px;padding:1px;z-index:5;pointer-events:none;animation:bc-pulse .9s ease-in-out infinite}
@keyframes bc-in{from{opacity:0;margin-top:-6px}}
.a-block-chains .tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:center;padding:12px;border-radius:24px;background:rgba(255,255,255,.6);border:3px solid rgba(43,45,66,.1);width:min(100%,560px);min-height:calc(var(--s) + 30px)}
.a-block-chains .tray .blk{cursor:grab}
.a-block-chains .tools{display:flex;gap:10px;justify-content:center}
.a-block-chains .hint{min-height:48px}
.a-block-chains .glow{box-shadow:0 0 0 5px rgba(255,209,102,.95)}

.a-robot-walks .rw-badge{position:absolute;top:-8px;right:-4px;font-size:1.7rem;line-height:1}
.a-robot-walks .rw-strip{width:100%;max-width:780px;min-height:92px;border:3px dashed ${Me};border-radius:20px;background:#fff;display:flex;flex-wrap:wrap;gap:8px;padding:10px;align-items:center;transition:background .2s}
.a-robot-walks .rw-strip.over{background:#fff6d6}
.a-robot-walks .rw-empty{flex:1;text-align:center;font-weight:800;opacity:.55;pointer-events:none}
.a-robot-walks .rw-tag{font-weight:900;font-size:.85rem;width:100%;max-width:780px;margin:-2px 0 -4px;padding-left:8px;opacity:.8}
.a-robot-walks .rw-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;width:100%}
.a-robot-walks .rw-card{position:relative;width:78px;height:82px;border:3px solid ${Me};border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 4px 0 rgba(43,45,66,.18);font-weight:900;font-size:.74rem;line-height:1;color:${Me};transition:transform .15s,opacity .2s}
.a-robot-walks .rw-card.sm{width:62px;height:68px;font-size:.66rem}
.a-robot-walks .rw-ico{width:36px;height:36px;pointer-events:none}
.a-robot-walks .rw-card.sm .rw-ico{width:30px;height:30px}
.a-robot-walks .rw-lab{pointer-events:none;white-space:nowrap}
.a-robot-walks .rw-card.now{outline:5px solid #ffd166;outline-offset:2px;transform:translateY(-6px) scale(1.06)}
.a-robot-walks .rw-card.bumped{outline:5px dashed #ff9f1c;outline-offset:2px;animation:rwshake .45s 2}
.a-robot-walks .rw-card.lift{opacity:.3}
.a-robot-walks .rw-ghost{position:fixed;margin:0;pointer-events:none;z-index:1000;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25));transition:none}
.a-robot-walks .rw-ctrl{min-height:56px}
.a-robot-walks .rw-sep{width:2px;height:56px;background:#e8dfc8;border-radius:2px}
.a-robot-walks .rw-bump{font-weight:900;font-size:34px;fill:#ff6b6b;stroke:#fff;stroke-width:6px;paint-order:stroke;animation:rwrise 1s ease-out forwards}
.a-robot-walks .rw-foot{font-weight:900;font-size:28px;fill:#f08c00;stroke:#fff;stroke-width:6px;paint-order:stroke}
@keyframes rwrise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-36px)}}
@keyframes rwshake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (max-width:560px){.a-robot-walks .rw-strip{padding:8px 5px;gap:6px;min-height:80px}.a-robot-walks .rw-card{width:66px;height:72px;font-size:.66rem}.a-robot-walks .rw-card.sm{width:56px;height:62px;font-size:.6rem}.a-robot-walks .rw-svg{max-height:30vh}.a-robot-walks .rw-sep{display:none}}

.a-construction-foreman{width:100%;max-width:1040px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start}
.a-construction-foreman.busy .cf-plan{pointer-events:none}
.a-construction-foreman .cf-scene{flex:1 1 360px;max-width:540px;min-width:0;border:3px solid ${We};border-radius:20px;overflow:hidden;background:linear-gradient(#dff3ff,#fff8e7 88%)}
.a-construction-foreman .cf-scene svg{display:block;width:100%;height:auto;max-height:40vh}
.a-construction-foreman .cf-plan{flex:1 1 320px;max-width:470px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.a-construction-foreman .cf-grid{display:grid;gap:4px;align-items:center;justify-content:center;width:100%}
.a-construction-foreman .cf-hd{text-align:center;font-weight:900;font-size:.95rem;border-radius:10px;padding:1px 0}
.a-construction-foreman .cf-hd.cf-corner{font-size:.65rem;opacity:.7}
.a-construction-foreman .cf-hd.now{background:var(--yellow)}
.a-construction-foreman .cf-who{display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:.8rem;line-height:1}
.a-construction-foreman .cf-who svg{width:30px;height:28px}
.a-construction-foreman .cf-cell{aspect-ratio:1/1;min-height:44px;border:3px dashed #c4b89c;border-radius:14px;background:#fffdf6;display:flex;padding:2px;transition:background .2s}
.a-construction-foreman .cf-cell.now{background:#fff1b8;border-style:solid;border-color:#f4b400}
.a-construction-foreman .cf-card{width:56px;height:56px;flex:none;border:3px solid ${We};border-radius:14px;font-size:1.6rem;font-weight:900;line-height:1;display:grid;place-items:center;position:relative;padding:0;color:${We};box-shadow:0 3px 0 rgba(43,45,66,.18)}
.a-construction-foreman .cf-cell .cf-card{width:100%;height:100%;font-size:1.35rem;border-radius:10px;box-shadow:none}
.a-construction-foreman .cf-card.glow,.a-construction-foreman .cf-cell.glow{box-shadow:0 0 0 5px rgba(255,190,40,.95)}
.a-construction-foreman .cf-card.cf-sel{outline:4px solid #ff9f1c;outline-offset:2px}
.a-construction-foreman .cf-yard{width:100%;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:center;min-height:76px;padding:8px;border:3px solid ${We};border-radius:18px;background:#fdf0d5}
.a-construction-foreman .cf-yard:empty::before{content:'All planned!';font-weight:800;opacity:.6;align-self:center}
.a-construction-foreman .cf-act{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:50px}
.a-construction-foreman .cf-info{font-weight:800}
.a-construction-foreman .cf-build:not([hidden]){animation:cfPulse 1.4s ease-in-out infinite}
@keyframes cfPulse{50%{transform:scale(1.06)}}
.a-construction-foreman .walk .lg1{animation:cfLeg .26s ease-in-out infinite alternate}
.a-construction-foreman .walk .lg2{animation:cfLeg .26s ease-in-out infinite alternate-reverse}
.a-construction-foreman .walk .cf-up{animation:cfBob .26s ease-in-out infinite alternate}
@keyframes cfLeg{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes cfBob{to{transform:translateY(-2px)}}

${e} .ctrl .btn{min-height:56px;min-width:56px;font-size:1.1rem}
${e} .rules{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;font-weight:800;font-size:1rem}
${e} .pair{background:#fff;border:2px dashed #2b2d42;border-radius:14px;padding:2px 10px;font-size:1.5rem;line-height:1.4}
@media (max-width:600px){
  ${e} .scene{flex-direction:column;min-height:0}
  ${e} .bank{flex:0 0 auto;min-height:90px;flex-direction:row;flex-wrap:wrap;padding:8px 8px 8px 36px}
  ${e} .river{flex:0 0 176px;animation-name:wgc-flow-x}
  ${e} .ctrl{gap:8px}
  ${e} .ctrl .btn{padding:.4em .75em;font-size:1rem}
  ${e} .boat{left:50%;margin-left:-75px;top:8px;margin-top:0}
  ${e} .boat.at-b{left:50%;top:calc(100% - 92px)}
  ${e} .scene.many .bank{flex:0 0 auto}
  ${e} .boat.wide{margin-left:-103px}
}

.a-necklaces{width:100%;max-width:920px;display:flex;flex-direction:column;align-items:center;gap:12px;padding-bottom:8px}
.a-necklaces .goal{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-weight:800;font-size:1.05rem;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:6px 14px;transition:box-shadow .2s}
.a-necklaces .need{display:inline-flex;gap:5px;align-items:center}
.a-necklaces .need i{width:24px;height:24px;border-radius:50%;border:3px dashed #118ab2;display:inline-block;box-sizing:border-box;transition:background .2s}
.a-necklaces .need i.on{border:3px solid var(--ink);background:${es}}
.a-necklaces .need i.over{border:3px solid var(--ink);background:${es};opacity:.55;transform:scale(.85)}
.a-necklaces .bench{position:relative;display:flex;align-items:center;gap:3px;padding:6px 20px;width:100%;box-sizing:border-box;background:#fdf0dc;border:3px solid var(--ink);border-radius:999px}
.a-necklaces .bench::before,.a-necklaces .mini::before{content:'';position:absolute;left:10px;right:10px;top:50%;height:5px;margin-top:-2.5px;background:#b07d4f;border-radius:3px}
.a-necklaces .clasp{position:absolute;left:3px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;border:3px solid #e0a800;box-sizing:border-box;background:#fdf0dc}
.a-necklaces .charm{position:absolute;right:3px;top:50%;transform:translateY(-52%);color:#ff5c8a;font-size:15px;line-height:1;font-weight:900}
.a-necklaces .bead{position:relative;flex:1 1 0;min-width:0;max-width:78px;aspect-ratio:1/1;border-radius:50%;border:3px solid var(--ink);padding:0;margin:0 auto;cursor:pointer;background:${Er};box-shadow:0 3px 0 rgba(43,45,66,.18);transition:transform .12s;-webkit-tap-highlight-color:transparent}
.a-necklaces .bead.blue{background:${es}}
.a-necklaces .bead:active{transform:scale(.92)}
.a-necklaces .bead.tip{box-shadow:0 0 0 6px rgba(255,209,102,.95);animation:nk-pulse 1s ease-in-out infinite}
.a-necklaces .bead.tap{transform:scale(.88)}
@keyframes nk-pulse{50%{box-shadow:0 0 0 10px rgba(255,209,102,.55)}}
.a-necklaces .controls .btn{font-size:1.05rem}
.a-necklaces .hintcard{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;background:#fffbe8;border:3px dashed var(--orange);border-radius:18px;padding:8px 12px;font-weight:800;max-width:100%;box-sizing:border-box}
.a-necklaces .hintcard[hidden]{display:none}
.a-necklaces .shelf{width:100%;box-sizing:border-box;background:linear-gradient(#f6e3c4,#efd5ab);border:3px solid var(--ink);border-radius:20px;padding:8px 10px 12px}
.a-necklaces .shelf.done{background:linear-gradient(#e2f9ec,#c8f1da)}
.a-necklaces .shelf-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:900;margin:0 4px 8px}
.a-necklaces .shelf-head .count{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:1.05rem}
.a-necklaces .shelf-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:40px}
.a-necklaces .shelf-row .empty-note{opacity:.6;font-weight:700;align-self:center}
.a-necklaces .mini{position:relative;display:inline-flex;align-items:center;gap:3px;padding:5px 17px;background:#fff;border:3px solid var(--ink);border-radius:999px;box-sizing:border-box}
.a-necklaces .mini i{position:relative;width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);background:${Er};box-sizing:border-box;transition:background .25s}
.a-necklaces .mini i.b{background:${es}}
.a-necklaces .mini .clasp{width:9px;height:9px;margin-top:-4.5px;border-width:2px;left:3px;background:#fff}
.a-necklaces .mini .charm{font-size:11px;right:3px}
.a-necklaces .mini.big{padding:7px 22px;gap:5px}
.a-necklaces .mini.big i{width:32px;height:32px;border-width:3px}
.a-necklaces .mini.empty{border-style:dashed;background:rgba(255,255,255,.45);color:rgba(43,45,66,.45);justify-content:center;font-weight:900}
.a-necklaces .mini.empty::before{display:none}
.a-necklaces .mini.new{animation:nk-new .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes nk-new{0%{transform:scale(.6)}60%{transform:scale(1.15)}}
.a-necklaces .nk-hand{position:fixed;left:0;top:0;font-size:42px;line-height:1;pointer-events:none;z-index:46;transition:transform .3s cubic-bezier(.4,.1,.2,1);filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.a-necklaces .btn.press{transform:translateY(3px);box-shadow:none}
.a-necklaces.flipround .clasp,.a-necklaces.flipround .charm{display:none}
.a-necklaces .bench.flipping{transition:transform .55s cubic-bezier(.4,.1,.2,1);transform:scaleX(-1)}

.a-shoes-in-dark{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:8px;margin:auto 0}
.a-shoes-in-dark .cap{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-weight:800;font-size:clamp(.95rem,3.6vw,1.15rem);text-align:center;min-height:36px}
.a-shoes-in-dark .dotc{display:inline-block;width:20px;height:20px;border-radius:50%;border:3px solid #2b2d42}
.a-shoes-in-dark .legend span.pic{display:inline-block;width:26px;height:40px}
.a-shoes-in-dark .legend{display:inline-flex;align-items:center;gap:4px;margin-right:6px}
.a-shoes-in-dark .scene{position:relative;box-sizing:content-box;width:220px;height:270px;max-width:100%;padding:0;border:3px solid #2b2d42;border-radius:26px;overflow:hidden;cursor:pointer;background:radial-gradient(circle at 50% 28%,#4b4f93,#1d1f45);box-shadow:0 5px 0 rgba(43,45,66,.18);flex:none}
.a-shoes-in-dark .scene>svg,.a-shoes-in-dark .scene>.bk,.a-shoes-in-dark .scene>.fr{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none}
.a-shoes-in-dark .scene.off{cursor:default;filter:saturate(.6) brightness(.85)}
.a-shoes-in-dark .scene.pulse{animation:sid-pulse 1.3s ease-in-out infinite}
@keyframes sid-pulse{50%{transform:scale(1.035)}}
.a-shoes-in-dark .hand{position:absolute;left:50%;top:0;width:60px;height:330px;pointer-events:none;transform:translate(-50%,-330px);transition:transform .46s cubic-bezier(.4,.1,.3,1);z-index:2}
.a-shoes-in-dark .hand .in{position:relative;width:60px;height:330px;transform-origin:30px 0}
.a-shoes-in-dark .hand svg{position:relative;z-index:2;display:block}
.a-shoes-in-dark .hand:not(.fist) .g-fist,.a-shoes-in-dark .hand.fist .g-open{display:none}
.a-shoes-in-dark .held{position:absolute;left:50%;top:216px;width:54px;height:66px;margin-left:-27px;z-index:1}
.a-shoes-in-dark .held .pic,.a-shoes-in-dark .item .pic{display:block;width:100%;height:100%}
.a-shoes-in-dark .held svg,.a-shoes-in-dark .item svg{width:100%;height:100%;display:block}
.a-shoes-in-dark .fr{z-index:3}
.a-shoes-in-dark .scene.rum .in{animation:sid-rum .2s ease-in-out 3}
.a-shoes-in-dark .scene.rum .fr{animation:sid-jig .2s ease-in-out 3}
@keyframes sid-rum{25%{transform:translateX(-7px) rotate(-5deg)}75%{transform:translateX(7px) rotate(5deg)}}
@keyframes sid-jig{25%{transform:translateX(-3px) rotate(-1deg)}75%{transform:translateX(3px) rotate(1deg)}}
.a-shoes-in-dark .tapme{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:4;background:#fff;border:3px solid #2b2d42;border-radius:999px;padding:2px 12px;font-weight:900;font-size:1rem;white-space:nowrap;pointer-events:none}
.a-shoes-in-dark .shelf{display:flex;gap:5px;justify-content:center;width:100%;padding-bottom:7px;border-bottom:7px solid #c98f45;border-radius:0 0 6px 6px}
.a-shoes-in-dark .slot{position:relative;flex:1 1 0;min-width:0;max-width:76px;aspect-ratio:4/5;border:3px dashed #d3c08f;border-radius:14px;background:rgba(255,255,255,.55)}
.a-shoes-in-dark .slot .no{position:absolute;left:4px;top:1px;font-size:.8rem;font-weight:900;color:#a8935f;z-index:1}
.a-shoes-in-dark .slot.full{border-style:solid;border-color:transparent;background:none}
.a-shoes-in-dark .item{position:absolute;inset:0;padding:3px;border-radius:14px;z-index:2}
.a-shoes-in-dark .item.pair{background:#fff3b8;box-shadow:0 0 0 4px rgba(255,209,102,.95)}
.a-shoes-in-dark .item.back .pic{transition:transform .5s,opacity .5s;transform:scale(.25);opacity:0}
.a-shoes-in-dark .ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:62px;width:100%}
.a-shoes-in-dark .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:340px}
.a-shoes-in-dark .chip.choice{min-width:58px;min-height:58px;font-size:1.9rem;font-weight:900;font-family:inherit;color:#2b2d42}
.a-shoes-in-dark .chip.ok{background:#06d6a0}
.a-shoes-in-dark .hist{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:34px;font-weight:800;font-size:.95rem}

.a-wrong-labels{width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:10px;margin:auto 0}

.a-wrong-labels .col.open .lid{transform:translateY(-2px) rotate(-9deg)}

iatrician. Several games go beyond what most young children can do alone; treat those as puzzles to explore together.",co=[{n:1,band:"about 3\xBD\u20135 years",text:"Many 3-year-olds count up to four objects and sort and compare small groups [1]. Using matching or counting to decide whether one group has more, fewer or the same is expected in kindergarten, at about 5\u20136 [2]. By about 5, children can usually put familiar daily events in order, even backwards [4].",games:[["Odd One Out","Sorting by one feature comes early [1]. Switching features so that a different item becomes the odd one is harder, so expect the later rounds to need help."]]},{n:2,band:"about 4\xBD\u20136 years, with several stretch games",text:"Three-year-olds copy simple repeating patterns [1], and pattern skill between 4 and 6 is linked to later maths [5].",games:[["Fold, Cut, Unfold","Picturing a fold in the mind appeared at about 5\xBD years, with large differences between children [6]."],["The Missing Shape","In similar matrix puzzles, correct answers rose from about 20% at age 6 to 78% at age 8 [7]. A stretch."],["Mirror Pegboard","Lines of symmetry are formally taught at about 9\u201310 (US Grade 4) [8]. A stretch: copying a mirror shape with help is the aim."],["Rope Rings","Sorting into two groups fits this age [1, 2]. The \u201Cboth\u201D and \u201Cneither\u201D zones draw on class logic that develops through the early school years [9]."],["The Ant on the Band","We found no age research on twisted (M\xF6bius) bands. Explore it together."]]},{n:3,band:"about 5\u20136\xBD years, with stretch games",text:"Putting shapes together to make bigger shapes is a kindergarten skill, at about 5\u20136 [3]. On Piaget\u2019s \u201Csame amount after pouring?\u201D tasks [10], many 4- to 6-year-olds succeed when the change looks accidental; how the question is asked matters a lot [11].",games:[["Dice Race","Babies already sense likely and unlikely outcomes [12], but school-age children still make errors on chance problems [13]. We found no age norms for two-dice totals, so treat it as a stretch."],["Which Room Is Larger?","Children in school grades 1\u20134 were still working out how unit squares cover a rectangle [14]."],["Squares That Grow","Research on growing patterns mostly involves children of about 8 [15]. A stretch."]]},{n:4,band:"about 5\xBD\u20137 years, with stretch games",text:"Children aged 4\xBD\u20136\xBD got better at ordering picture-stories after programming robots [16]. Splitting small numbers into pairs (5 = 2 + 3 = 4 + 1) is a kindergarten skill [17].",games:[["Tower of Hanoi and Builder Team","4- to 6-year-olds can plan short versions, and older children do better [18]. The age gap widens as puzzles get longer [19], so the 4-disc rounds are a stretch."],["Make It Twice as Big","By about 6, children judge proportions of continuous amounts, but proportions with countable units such as grid squares stay hard until 10\u201312 [20]. A stretch."],["Chain of Blocks","Keeping several features in mind at once develops through the early school years [9]."]]},{n:5,band:"about 7 years and up; best done together",text:"These are classic puzzles for older children and adults.",games:[["Necklace Makers","Children began listing combinations systematically at about 7 [21]. Spotting necklaces that are the same when turned or flipped is harder still."],["All the Labels Are Wrong","3- to 5-year-olds make simple \u201Cnot here, so it must be there\u201D inferences [22]. This puzzle chains several of them."],["Wolf, Goat and Cabbage and Shoes in the Dark","We found no age research on these puzzles. Enjoy them together, not as something a child \u201Cshould\u201D solve."]]}],Vr="How these ranges were made: each band is our synthesis across the studies and frameworks below, not a figure from any single study. Most of the evidence comes from US and UK children, and the Common Core and NAEYC anchors are US frameworks.",Xr=["National Association for the Education of
