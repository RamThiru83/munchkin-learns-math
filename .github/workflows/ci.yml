# Runs every check on each push and pull request. The site itself is deployed by GitHub Pages from main.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - name: Built index.html matches the source
        run: |
          npm run build
          git diff --exit-code -- index.html src/activities/index.js || (echo "::error::index.html is out of date. Run npm run build and commit it." && exit 1)
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (built site)
        run: npx playwright test
        env:
          TARGET: built
      - name: Play-throughs (built site)
        run: npx playwright test tests/playthrough --project=desktop
        env:
          TARGET: built
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 14
